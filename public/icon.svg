<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#emeraldGrad)" />

  <!-- White Speech Bubble -->
  <g fill="#FFFFFF">
    <!-- Bubble Body -->
    <rect x="76" y="82" width="360" height="286" rx="82" />
    <!-- Bubble Tail -->
    <path d="M 142 342 L 120 448 C 120 448, 140 448, 160 410 L 220 342 Z" />
    <circle cx="120" cy="442" r="12" />
  </g>

  <!-- Reply Arrow / 'R' Symbol in Bubble -->
  <g fill="none" stroke="#059669" stroke-linecap="round" stroke-linejoin="round">
    <!-- R Stem -->
    <line x1="184" y1="145" x2="184" y2="305" stroke-width="32" />
    
    <!-- Top Arc & Curve of R -->
    <path d="M 184 145 L 260 145 C 304 145 304 225 260 225 L 184 225" stroke-width="32" />

    <!-- R Leg -->
    <line x1="245" y1="225" x2="305" y2="305" stroke-width="32" />

    <!-- Reply Arrowhead sweeping left into top of R -->
    <path d="M 160 145 L 195 110 M 160 145 L 195 180" stroke-width="28" />
  </g>
</svg>
